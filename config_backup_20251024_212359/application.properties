spring.application.name=user-service # take a look at this

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/ads-proj-db
spring.datasource.username=zent
spring.datasource.password=password

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always

# Server Configuration
server.port=8081

# Logging Configuration
logging.level.com.umu.ads_proj=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n

# Actuator Configuration (for performance monitoring)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Performance metrics
management.metrics.tags.application=user-service
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=ads-proj-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.umu.ads_proj.event
# spring.kafka.consumer.properties.spring.json.value.default.type=com.umu.ads_proj.event.OrderEvent

spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true


# Kafka Topic Configuration
app.kafka.topics.user-events=user-events
app.kafka.topics.load-events=load-events
app.kafka.topics.performance-events=performance-events
app.kafka.topics.order-events=order-events
app.kafka.topics.payment-events=payment-events
app.kafka.topics.notification-events=notification-events