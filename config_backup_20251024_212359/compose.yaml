services:
  postgres:
    image: postgres:latest
    container_name: ads-proj-postgres
    environment:
      - POSTGRES_DB=ads-proj-db
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=zent
    ports:
      - "5432:5432"
    networks: [ads-network]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: ads-proj-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks: [ads-network]

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: ads-proj-kafka
    depends_on: [zookeeper]
    ports:
      - "9092:9092"        # host access
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # Bind two listeners (host + internal)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092
      # Tell clients what to dial for each
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://ads-proj-kafka:29092
      # Map names to protocols and pick inter-broker name
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks: [ads-network]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ads-proj-kafka-ui
    depends_on: [kafka]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ads-kafka-cluster
      # IMPORTANT: use the INTERNAL listener reachable from containers
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ads-proj-kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks: [ads-network]

networks:
  ads-network:
    driver: bridge
