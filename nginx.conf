events {
    worker_connections 4096;
}

http {
    upstream order_service {
        least_conn;  # Load balancing algorithm
        
        # Docker Compose will create these service instances
        server order-service:8081 max_fails=3 fail_timeout=30s;
        
        # Additional instances will be added by Docker Compose --scale
        # They will automatically get different container names:
        # ads-proj-order-service-1, ads-proj-order-service-2, etc.
    }

    server {
        listen 80;
        server_name localhost;

        # Increase timeouts for long-running requests
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Increase buffer sizes for high throughput
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        location / {
            proxy_pass http://order_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Enable keepalive for better performance
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
